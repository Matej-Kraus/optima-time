[project]
name = "optima-time"
version = "0.1.0"
description = "Reads a physical LED scoreboard from video and writes the values to an XML file for vMix."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "opencv-python-headless==5.0.0.93",
    "onnxruntime==1.32.0",
    "pydantic==2.14.3",
    "fastapi==0.162.7",
    "uvicorn==0.54.0",
    "cyndilib==0.1.3",
    "cv2-enumerate-cameras==1.4.0",
    "psutil==7.2.2",
    # tray icon of the packaged Windows app (tray.py)
    "pystray==0.19.5; sys_platform == 'win32'",
    "pillow==13.0.0; sys_platform == 'win32'",
    "pywebview==6.2.1; sys_platform == 'win32'",
]

[project.scripts]
optima-time = "optima_time.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "pyright==1.1.414",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pillow==13.0.0",
]
# Building the Windows package (packaging/, scripts/build_windows.ps1).
build = [
    "pyinstaller==6.22.3",
    "pyyaml==6.0.3",
]
# One-off experiments in spikes/ (Milestone 0). Not part of the product.
spikes = [
    "pyyaml==6.0.3",
    "pillow==13.0.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/optima_time"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["frontend", "docs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["optima_time"]

[tool.pyright]
include = ["backend", "tests", "tools"]  # spikes/ are one-off: ruff only
pythonVersion = "3.13"
typeCheckingMode = "standard"
